# Migrated from ghostty config

# Font (ghostty bundles JetBrains Mono; matching it)
font_family      JetBrainsMono Nerd Font
font_size        11.0

# Window: 112x32 cells, no decorations (niri prefer-no-csd)
remember_window_size  no
initial_window_width  112c
initial_window_height 32c
hide_window_decorations yes

# Background (ghostty: opacity 0.85, blur 50 — kitty supports niri's blur protocol)
background_opacity 0.70
background_blur   20 

# Tabs on top like ghostty's GTK tabs
tab_bar_edge top
tab_bar_style separator
tab_powerline_style slanted

# Shell integration (automatic, fish detected)
shell_integration enabled

# ---- Adwaita Dark theme (ghostty's "Adwaita Dark") ----
background #1e1e1e
foreground #c0bfbc
cursor     #c0bfbc
selection_background #3584e4
selection_foreground #ffffff

color0  #241f31
color1  #c01c28
color2  #2ec27e
color3  #f5c211
color4  #1e78e4
color5  #9841bb
color6  #0ab9dc
color7  #c0bfbc
color8  #5e5c64
color9  #ed333b
color10 #57e389
color11 #f8e45c
color12 #51a1ff
color13 #c061cb
color14 #4fd2fd
color15 #f6f5f4

# Tab bar colors to match
active_tab_background   #c0bfbc
active_tab_foreground   #1e1e1e
inactive_tab_background #2a2a2a
inactive_tab_foreground #c0bfbc

# ---- Keybinds (ghostty parity) ----
# ctrl+c: copy if there is a selection, otherwise send interrupt
map ctrl+c        copy_or_interrupt
map ctrl+shift+c  copy_to_clipboard
map ctrl+v        paste_from_clipboard
map ctrl+t        new_tab
map ctrl+w        close_tab
map ctrl+shift+/ search_scrollback
map --allow-fallback=shifted,ascii cmd+f search_scrollback 🍎
