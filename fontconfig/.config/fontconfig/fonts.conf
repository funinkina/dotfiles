<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <dir>~/.local/share/fonts</dir>

  <!-- Apple/CSS system-font keywords -> our UI font -->
  <alias binding="strong">
    <family>-apple-system</family>
    <prefer><family>Adwaita Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>BlinkMacSystemFont</family>
    <prefer><family>Adwaita Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>.AppleSystemUIFont</family>
    <prefer><family>Adwaita Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>.SF NS</family>
    <prefer><family>Adwaita Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Adwaita Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-sans-serif</family>
    <prefer><family>Adwaita Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-serif</family>
    <prefer><family>Noto Serif</family></prefer>
  </alias>

  <!-- Generics. Every one must be pinned, or fontconfig picks by PANOSE
       class and hands decorative junk (Impact / Comic Sans) to the web. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Noto Sans</family>
      <family>Segoe UI Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Segoe UI Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Mono</family>
      <family>Segoe UI Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>cursive</family>
    <prefer><family>Adwaita Sans</family></prefer>
  </alias>

  <alias>
    <family>fantasy</family>
    <prefer><family>Adwaita Sans</family></prefer>
  </alias>

  <alias>
    <family>emoji</family>
    <prefer><family>Segoe UI Emoji</family></prefer>
  </alias>

  <!-- Rendering -->
  <match target="font">
    <edit mode="assign" name="hinting"><bool>true</bool></edit>
  </match>
  <match target="font">
    <edit mode="assign" name="hintstyle"><const>hintslight</const></edit>
  </match>
  <match target="font">
    <edit mode="assign" name="antialias"><bool>true</bool></edit>
  </match>
  <match target="font">
    <edit mode="assign" name="rgba"><const>rgb</const></edit>
  </match>
  <match target="font">
    <edit mode="assign" name="lcdfilter"><const>lcddefault</const></edit>
  </match>

</fontconfig>
