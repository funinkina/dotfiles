<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Map Apple system font CSS keywords → SF Pro -->
  <alias binding="strong">
    <family>-apple-system</family>
    <prefer><family>SF Pro Text</family></prefer>
  </alias>

  <alias binding="strong">
    <family>BlinkMacSystemFont</family>
    <prefer><family>SF Pro Text</family></prefer>
  </alias>

  <alias binding="strong">
    <family>.AppleSystemUIFont</family>
    <prefer><family>SF Pro Text</family></prefer>
  </alias>

  <alias binding="strong">
    <family>.SF NS</family>
    <prefer><family>SF Pro Text</family></prefer>
  </alias>

  <!-- Also alias the generic "system-ui" CSS keyword -->
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>SF Pro Text</family></prefer>
  </alias>

  <!-- Default sans-serif -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>SF Pro Text</family></prefer>
  </alias>

  <!-- Rendering -->
  <match target="font">
    <edit mode="assign" name="hinting"><bool>true</bool></edit>
  </match>
  <match target="font">
    <edit mode="assign" name="hintstyle"><const>hintslight</const></edit>
  </match>
  <match target="font">
    <edit mode="assign" name="rgba"><const>vrgb</const></edit>
  </match>
  <match target="font">
    <edit mode="assign" name="antialias"><bool>true</bool></edit>
  </match>

</fontconfig>
