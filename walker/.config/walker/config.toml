theme = "noir"
keybind_symbols = false

[keybinds]
quick_activate = ["ctrl 1", "ctrl 2", "ctrl 3", "ctrl 4", "ctrl 5"]
# Exclusive keyboard while open — required with focus-follows-mouse,
# which otherwise steals focus to whatever is under the cursor
force_keyboard_focus = true

# Include menus so "help"/"cheatsheet" is findable from the default search
[providers]
default = ["desktopapplications", "calc", "websearch", "menus"]
empty = ["desktopapplications"]

# Full prefix table: walker defaults + custom providers.
# NOTE: "//" for snippets collided with "/" (files); "~" is unclaimed.
[[providers.prefixes]]
prefix = ";"
provider = "providerlist"

[[providers.prefixes]]
prefix = ">"
provider = "runner"

[[providers.prefixes]]
prefix = "/"
provider = "files"

[[providers.prefixes]]
prefix = "."
provider = "symbols"

[[providers.prefixes]]
prefix = "!"
provider = "todo"

[[providers.prefixes]]
prefix = "%"
provider = "bookmarks"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

[[providers.prefixes]]
prefix = ":"
provider = "clipboard"

[[providers.prefixes]]
prefix = "$"
provider = "windows"

[[providers.prefixes]]
prefix = "~"
provider = "snippets"

[[providers.prefixes]]
prefix = "pkg:"
provider = "archlinuxpkgs"

[[providers.prefixes]]
prefix = "bt:"
provider = "bluetooth"

[[providers.prefixes]]
prefix = "snd:"
provider = "wireplumber"

[[providers.prefixes]]
prefix = "na:"
provider = "niriactions"

[[providers.prefixes]]
prefix = "ns:"
provider = "nirisessions"

[[providers.prefixes]]
prefix = "bw:"
provider = "bitwarden"

[[providers.prefixes]]
prefix = "?"
provider = "menus"
